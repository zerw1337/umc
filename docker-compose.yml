networks:
  app:
    driver: bridge


services:

  nginx:
    image: nginx:alpine
    container_name: umc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app

  backend:
    build:
      dockerfile: ./Dockerfile
      context: ./backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    networks:
      - app


  frontend:
    build:
      dockerfile: ./Dockerfile
      context: ./main-front

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app


  basicpwa:
    build:
      dockerfile: ./Dockerfile
      context: ./basic-pwa-front

    depends_on:
      - backend
      - frontend

    restart: unless-stopped

    networks:
      - app

networks:
  app:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: umc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./downloads:/var/www/downloads:ro
    depends_on:
      - frontend
      - basicpwa
      - musicpwa
    networks:
      - app

  frontend:
    build:
      context: ./main-front
    depends_on:
    restart: unless-stopped
    networks:
      - app

  basicpwa:
    build:
      context: ./basic-pwa-front
    restart: unless-stopped
    networks:
      - app

  musicpwa:
    build:
      context: ./music-front
    restart: unless-stopped
    networks:
      - app

networks:
  app:


services:

  backend:
    build:
      dockerfile: ./Dockerfile
      context: ./backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    networks:
      - app


  frontend:
    build:
      dockerfile: ./Dockerfile
      context: ./main-front

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app